name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Версии actions держим на Node 24: checkout v5+ и setup-python v6+.
# v4 и v5 соответственно ещё работают на Node 20 и дают предупреждение.
# Раннер прибит к 24.04: у ubuntu-latest с 19.10.2026 идёт миграция на Ubuntu 26.

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Только лёгкие зависимости: PySide6 и torch в CI не нужны.
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts python-dotenv openai numpy

      - name: Синтаксис
        run: python -m compileall -q app main.py tools

      - name: Самопроверка
        run: python tools/selftest.py

      - name: Проверка клиента модели (офлайн)
        run: python tools/check_llm.py

      - name: Пример конфига — валидный JSON
        run: python -c "import json; json.load(open('config.example.json', encoding='utf-8'))"

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Секреты и личные файлы не должны попадать в git
        run: |
          status=0
          # Ключи вида sk-...
          if git grep -n -I -E 'sk-[A-Za-z0-9]{20,}' -- . ':!*.md'; then
            echo "::error::Найден похожий на ключ токен"
            status=1
          fi
          # Личные файлы в индексе
          for path in .env config.json; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path попал в репозиторий"
              status=1
            fi
          done
          # Тяжёлые каталоги
          for dir in models wheels samples .venv; do
            if git ls-files "$dir" | grep -q .; then
              echo "::error::каталог $dir попал в репозиторий"
              status=1
            fi
          done
          exit $status
